    <script id="digitalhood-theme">
(function () {
  var preference = 'system';
  try {
    var match = document.cookie.match(/(?:^|;\s*)digitalhood_theme=([^;]*)/);
    preference = match ? decodeURIComponent(match[1]) : (window.localStorage.getItem('digitalhood-theme-preference-v1') || 'system');
  } catch (error) { /* Restricted storage must not prevent the page from starting. */ }
  if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
  var dark = preference === 'dark';
  try { if (preference === 'system' && window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (error) {}
  var root = document.documentElement;
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  root.setAttribute('data-theme-preference', preference);
  root.className = root.className.replace(/(^|\s)dark(?=\s|$)/g, ' ').replace(/^\s+|\s+$/g, '');
  if (dark) root.className += ' dark';
  root.style.colorScheme = dark ? 'dark' : 'light';
}());
    </script>

    <style>

    <script id="digitalhood-bootstrap">
/* This recovery code deliberately uses ES5 syntax; it must run without the app bundle. */
(function () {
  var ready = false;
  var timer;
  function message(text) {
    var element = document.getElementById('dh-startup-status');
    if (element) {
      while (element.firstChild) element.removeChild(element.firstChild);
      element.appendChild(document.createTextNode(text));
    }
  }
  function lowData() {
    var connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    try { if (window.localStorage.getItem('digitalhood_data_saver') === 'on') return true; } catch (error) {}
    return !!(connection && (connection.saveData || /^(slow-2g|2g|3g)$/.test(connection.effectiveType || '')));
  }
  function addScript(src, onload, attributes) {
    var script = document.createElement('script');
    script.async = true;
    script.src = src;
    if (onload) script.onload = onload;
    if (attributes) for (var key in attributes) if (Object.prototype.hasOwnProperty.call(attributes, key)) script.setAttribute(key, attributes[key]);
    script.onerror = function () { /* Optional integrations never control app startup. */ };
    document.head.appendChild(script);
  }
  function optionalIntegrations() {
    if (lowData()) return;
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
    window.gtag('js', new Date());
    window.gtag('config', 'G-XG41R92KG2');
    addScript('https://www.googletagmanager.com/gtag/js?id=G-XG41R92KG2');
    addScript('https://www.gstatic.com/shopping/merchant/merchantwidget.js', function () {
      try {
        if (window.merchantwidget && window.merchantwidget.start) window.merchantwidget.start({ merchant_id: 5857752325, position: 'RIGHT_BOTTOM' });
      } catch (error) {}
    });
    addScript('https://static.cloudflareinsights.com/beacon.min.js', null, { 'data-cf-beacon': '{"token":"b31098c2b8064d01b036bb0284c6eaa1"}' });
  }
  window.__digitalhoodBootReady = function () {
    if (ready) return;
    ready = true;
    window.clearTimeout(timer);
    var startup = document.getElementById('dh-startup');
    if (startup && startup.parentNode) startup.parentNode.removeChild(startup);
    // Give the route and initial product request a head start; skip optional downloads on low-data connections.
    window.setTimeout(optionalIntegrations, 6000);
  };
  timer = window.setTimeout(function () {
    if (!ready) message('The full marketplace is taking longer than usual. You can keep waiting or use the low-data catalogue above.');
  }, 8000);
  window.addEventListener('error', function (event) {
    var target = event.target;
    if (!ready && (target === window || (target && target.tagName === 'SCRIPT'))) {
      message('The full marketplace could not start. Use the low-data catalogue above, or retry this page.');
    }
  }, true);
  window.addEventListener('vite:preloadError', function () {
    if (!ready) message('A marketplace file could not download. Use the low-data catalogue above, or retry this page.');
    // Do not reload automatically or suppress the React error boundary.
  });
  if (!('noModule' in document.createElement('script')) || !window.Promise || !window.fetch || !window.AbortController) {
    message('This browser needs the low-data catalogue. Use the link above to browse without the full app.');
    // Only public browsing routes can be redirected. Never redirect a payment/account flow.
    var pathname = window.location.pathname;
    var destination = '';
    if (pathname === '/' || pathname === '/shop' || pathname === '/search' || pathname === '/categories') destination = '/lite';
    if (/^\/product\/[^/]+\/?$/.test(pathname)) destination = '/lite' + pathname;
    if (destination) window.location.replace(destination);
  }
}());
