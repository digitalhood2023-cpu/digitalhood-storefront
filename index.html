    <script id="digitalhood-theme">
(function () {
  var preference = 'system';
  try {
    var match = document.cookie.match(/(?:^|;\s*)digitalhood_theme=([^;]*)/);
    preference = match ? decodeURIComponent(match[1]) : (window.localStorage.getItem('digitalhood-theme-preference-v1') || 'system');
  } catch (error) { /* Restricted storage must not prevent the page from starting. */ }
  if (preference !== 'light' && preference !== 'dark' && preference !== 'system') preference = 'system';
  var dark = preference === 'dark';
  try { if (preference === 'system' && window.matchMedia) dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (error) {}
  var root = document.documentElement;
  root.setAttribute('data-theme', dark ? 'dark' : 'light');
  root.setAttribute('data-theme-preference', preference);
  root.className = root.className.replace(/(^|\s)dark(?=\s|$)/g, ' ').replace(/^\s+|\s+$/g, '');
  if (dark) root.className += ' dark';
  root.style.colorScheme = dark ? 'dark' : 'light';
}());

    <!-- A lightweight branded shell is the only normal pre-React paint. -->
    <style>
      #dh-app-shell { min-height:100vh; background:#fff; color:#172033; font:16px/1.5 Arial,sans-serif; }

      #dh-app-shell .dh-shell-brand img { width:42px; height:42px; border-radius:50%; object-fit:contain; }
      #dh-app-shell .dh-shell-search { width:min(46vw,620px); height:42px; border-radius:999px; background:#f0f2f6; }
      #dh-app-shell .dh-shell-hero { display:grid; grid-template-columns:minmax(0,1fr) minmax(320px,.82fr); gap:42px; align-items:center; max-width:1500px; margin:0 auto; padding:58px 24px 48px; }
      #dh-app-shell .dh-shell-copy { display:grid; gap:16px; }
      #dh-app-shell .dh-shell-line, #dh-app-shell .dh-shell-card { background:#edf0f5; animation:dh-shell-pulse 1.4s ease-in-out infinite; }
      #dh-app-shell .dh-shell-line { height:18px; border-radius:999px; }
      #dh-app-shell .dh-shell-line-primary { width:min(620px,92%); height:54px; background:#e1e2f1; }
      #dh-app-shell .dh-shell-line-secondary { width:min(520px,78%); }
      #dh-app-shell .dh-shell-card { min-height:330px; border-radius:28px; background:#e8e9f4; }
      #dh-startup { display:none; background:#fff; color:#172033; font:16px/1.6 Arial,sans-serif; padding:24px 18px; min-height:240px; }
      #dh-startup.dh-startup-visible { display:block; }
      #dh-startup .dh-startup-inner { max-width:820px; margin:0 auto; }
      #dh-startup h1 { font-size:28px; margin:0 0 12px; color:#15125f; }
      #dh-startup a { color:#15125f; text-decoration:underline; }

    <script id="digitalhood-bootstrap">
/* This recovery code deliberately uses ES5 syntax; it must run without the app bundle. */
(function () {
  var ready = false;
  var timer;
  function revealRecovery(text) {
    var shell = document.getElementById('dh-app-shell');
    var startup = document.getElementById('dh-startup');
    if (text) message(text);
    if (shell) shell.style.display = 'none';
    if (startup && !/(^|\s)dh-startup-visible(\s|$)/.test(startup.className)) startup.className += ' dh-startup-visible';
  }
  function message(text) {
    var element = document.getElementById('dh-startup-status');
    if (element) {
      while (element.firstChild) element.removeChild(element.firstChild);
      element.appendChild(document.createTextNode(text));
    }
  }
  function lowData() {
    var connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    try { if (window.localStorage.getItem('digitalhood_data_saver') === 'on') return true; } catch (error) {}
    return !!(connection && (connection.saveData || /^(slow-2g|2g)$/.test(connection.effectiveType || '')));
  }
  function addScript(src, onload, attributes) {
    var script = document.createElement('script');
    script.async = true;
    script.src = src;
    if (onload) script.onload = onload;
    if (attributes) for (var key in attributes) if (Object.prototype.hasOwnProperty.call(attributes, key)) script.setAttribute(key, attributes[key]);
    script.onerror = function () { /* Optional integrations never control app startup. */ };
    document.head.appendChild(script);
  }
  function optionalIntegrations() {
    if (lowData()) return;
    window.dataLayer = window.dataLayer || [];
    window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
    window.gtag('js', new Date());
    window.gtag('config', 'G-XG41R92KG2');
    addScript('https://www.googletagmanager.com/gtag/js?id=G-XG41R92KG2');
    addScript('https://www.gstatic.com/shopping/merchant/merchantwidget.js', function () {
      try {
        if (window.merchantwidget && window.merchantwidget.start) window.merchantwidget.start({ merchant_id: 5857752325, position: 'RIGHT_BOTTOM' });
      } catch (error) {}
    });
    addScript('https://static.cloudflareinsights.com/beacon.min.js', null, { 'data-cf-beacon': '{"token":"b31098c2b8064d01b036bb0284c6eaa1"}' });
  }
  window.__digitalhoodBootReady = function () {
    if (ready) return;
    ready = true;
    window.clearTimeout(timer);
    var startup = document.getElementById('dh-startup');
    var shell = document.getElementById('dh-app-shell');
    if (startup && startup.parentNode) startup.parentNode.removeChild(startup);
    if (shell && shell.parentNode) shell.parentNode.removeChild(shell);
    // Give the route and initial product request a head start; skip optional downloads on low-data connections.
    window.setTimeout(optionalIntegrations, 6000);
  };
  timer = window.setTimeout(function () {
    if (!ready) revealRecovery('The full marketplace is taking longer than usual. You can keep waiting or use the low-data catalogue below.');
  }, 8000);
  window.addEventListener('error', function (event) {
    var target = event.target;
    if (!ready && (target === window || (target && target.tagName === 'SCRIPT'))) {
      revealRecovery('The full marketplace could not start. Use the low-data catalogue below, or retry this page.');
    }
  }, true);
  window.addEventListener('vite:preloadError', function () {
    if (!ready) revealRecovery('A marketplace file could not download. Use the low-data catalogue below, or retry this page.');
    // Do not reload automatically or suppress the React error boundary.
  });
  if (!('noModule' in document.createElement('script')) || !window.Promise || !window.fetch || !window.AbortController) {
    revealRecovery('This browser needs the low-data catalogue. Use the link below to browse without the full app.');
    // Only public browsing routes can be redirected. Never redirect a payment/account flow.
    var pathname = window.location.pathname;
    var destination = '';
    if (pathname === '/' || pathname === '/shop' || pathname === '/search' || pathname === '/categories') destination = '/lite';
    if (/^\/product\/[^/]+\/?$/.test(pathname)) destination = '/lite' + pathname;
    if (destination) window.location.replace(destination);
  }
}());
