name: Order resolution browser acceptance

on:
  push:
    branches: [feature/order-resolutions]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/check-resolution-ui.cjs'
      - 'scripts/*product*'
      - 'scripts/*variation*'
      - 'config/product-template.json'
      - '.github/workflows/resolution-ui.yml'

permissions:
  contents: read

concurrency:
  group: resolution-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/validate-product-template.mjs
      - run: npm run build
      - name: Install isolated browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/resolution-ui" --no-save --ignore-scripts playwright@1.62.1
          "$RUNNER_TEMP/resolution-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test fixture cases, replies and responsive themes
        env:
          RESOLUTION_UI_ROLE: buyer
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4273 > "$RUNNER_TEMP/resolution-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4273/ > /dev/null; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/resolution-ui/node_modules" node scripts/check-resolution-ui.cjs
          NODE_PATH="$RUNNER_TEMP/resolution-ui/node_modules" node scripts/check-product-template-ui.cjs
          NODE_PATH="$RUNNER_TEMP/resolution-ui/node_modules" node scripts/check-variation-review-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolution-ui-buyer
          path: scripts/order-resolution-ui/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-template-acceptance
          path: |
            scripts/product-template-ui/
            scripts/product-editor-ui/
            scripts/variation-review-ui/
          if-no-files-found: ignore
