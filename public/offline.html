<!doctype html>
<html lang="en-ZM">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15125f" />
    <title>DigitalHood is offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f8fafc;color:#111827;font:15px/1.5 system-ui,sans-serif;padding:24px}.card{width:min(100%,420px);background:#fff;border:1px solid #e5e7eb;border-radius:22px;padding:24px;box-shadow:0 18px 50px rgba(15,23,42,.08)}img{width:48px;height:48px;border-radius:12px}.eyebrow{color:#6b7280;font-size:12px;text-transform:uppercase;letter-spacing:.12em}h1{font-size:24px;line-height:1.15;margin:14px 0 8px}p{color:#4b5563;margin:0 0 18px}button{width:100%;border:0;border-radius:12px;background:#15125f;color:white;font-weight:700;padding:13px;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/logo.jpg" alt="DigitalHood" />
      <div class="eyebrow">Connection paused</div>
      <h1>You’re offline for a moment</h1>
      <p>Previously opened public pages may still work. Payments, orders, account changes and delivery confirmation wait for a secure connection.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
