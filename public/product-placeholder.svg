<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">Product image unavailable</title>
  <desc id="description">A neutral shopping bag illustration used when a product has no available photo.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb54a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="48" fill="url(#background)"/>
  <circle cx="400" cy="280" r="150" fill="#ffffff"/>
  <path d="M300 245h200l-18 190H318l-18-190Z" fill="url(#bag)"/>
  <path d="M350 260v-32c0-28 22-50 50-50s50 22 50 50v32" fill="none" stroke="#111827" stroke-width="18" stroke-linecap="round"/>
  <path d="M360 330h80" stroke="#111827" stroke-width="16" stroke-linecap="round" opacity=".78"/>
  <text x="400" y="505" fill="#475569" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Product photo coming soon</text>
</svg>
